name: Bug Report
description: Report a bug with the FinTS Banking Home Assistant integration
title: '[Bug]: '
labels: ['bug', 'triage']
assignees:
  - FaserF
body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting
        - 🔍 Search [existing issues](https://github.com/FaserF/ha-fints/issues) to avoid duplicates
        - 🔗 View the integration: [![Open your Home Assistant instance and show the fints integration.](https://my.home-assistant.io/badges/integration.svg)](https://my.home-assistant.io/redirect/integration/?domain=fints)
        - ⚠️ **SECURITY REMINDER**: Never post your banking PIN, login credentials, or full unmasked IBANs!

  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      description: Which version of ha-fints are you running?
      placeholder: e.g. v1.0.0
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      description: |
        [![Open your Home Assistant instance and show your Home Assistant version information.](https://my.home-assistant.io/badges/info.svg)](https://my.home-assistant.io/redirect/info/)
      placeholder: e.g. 2026.10.1
    validations:
      required: true

  - type: dropdown
    id: ha_install_type
    attributes:
      label: Home Assistant Installation Type
      description: |
        Can be found in: [![Open your Home Assistant instance and show your Home Assistant version information.](https://my.home-assistant.io/badges/info.svg)](https://my.home-assistant.io/redirect/info/)
      options:
        - Home Assistant OS
        - Home Assistant Container
        - Home Assistant Supervised
        - Home Assistant Core
    validations:
      required: true

  - type: input
    id: bank_name_blz
    attributes:
      label: Bank Name / BLZ
      description: What bank institution are you connecting to? (e.g. Sparkasse KölnBonn, DKB, ING, Volksbank)
      placeholder: e.g. DKB (BLZ 12030000)
    validations:
      required: true

  - type: dropdown
    id: tan_method
    attributes:
      label: TAN / 2FA Method
      description: Which TAN or second-factor method does your bank account use?
      options:
        - PushTAN / Banking App
        - photoTAN
        - ChipTAN / Sm@rt-TAN
        - BestSign
        - None / Decoupled
        - Other / Unknown
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Add integration with '...'
        2. Wait for poll interval / click sync button
        3. See error in logs / sensors unavailable
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (Masked)
      description: |
        Download diagnostics from the integration page and paste here (sensitive credentials are automatically redacted):
        [![Open your Home Assistant instance and show the fints integration.](https://my.home-assistant.io/badges/integration.svg)](https://my.home-assistant.io/redirect/integration/?domain=fints)
      render: json
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: |
        Enable debug logging and paste relevant log lines here.
        Add to `configuration.yaml`:
        ```yaml
        logger:
          default: warning
          logs:
            custom_components.fints: debug
        ```
      render: shell
    validations:
      required: true
